<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nemla · Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
  :root {
    --bg: #F7F4EE;
    --surface: #FDFBF7;
    --surface-2: #F1ECE2;
    --border: #E0D9C9;
    --border-strong: #C9C0AB;
    --text: #2A2822;
    --text-dim: #5E574B;
    --text-faint: #8F897A;
    --accent: #A07A1F;
    --accent-soft: #F3E9CF;
    --health: #A8475F;
    --health-soft: #F3DDE3;
    --back: #3E6A88;
    --legs: #5B8C47;
    --play: #B86842;
    --push: #A8475F;
    --rest: #A9A292;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(168,71,95,0.05) 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(62,106,136,0.05) 0%, transparent 50%);
    background-attachment: fixed;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
  [hidden] { display: none !important; }

  .shell { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
  .brand-link { display: flex; flex-direction: column; }
  .brand-mark { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: 0.2px; }
  .brand-tag { font-size: 11px; color: var(--text-faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 1.5px; }
  .user-chip { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--health-soft); color: var(--health);
    display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 12px;
  }
  .icon-btn { color: var(--text-faint); font-size: 12px; padding: 4px 8px; border-radius: 4px; }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); }

  .signin-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 3rem 2.5rem; max-width: 460px; margin: 4rem auto 0; text-align: center;
  }
  .signin-card .lock {
    width: 56px; height: 56px; margin: 0 auto 1.5rem; background: var(--health-soft);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--health);
  }
  .signin-card h2 { font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 500; margin-bottom: 8px; }
  .signin-card p { color: var(--text-dim); font-size: 13px; margin-bottom: 2rem; line-height: 1.6; }
  .signin-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 12px 20px; background: var(--text); color: var(--surface); border-radius: 8px;
    font-size: 14px; font-weight: 500; transition: background 0.15s;
  }
  .signin-btn:hover { background: #1a1814; }
  .signin-btn:disabled { opacity: 0.6; cursor: wait; }
  .ms-logo { width: 16px; height: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .ms-logo span { display: block; }
  .ms-logo span:nth-child(1) { background: #F25022; }
  .ms-logo span:nth-child(2) { background: #7FBA00; }
  .ms-logo span:nth-child(3) { background: #00A4EF; }
  .ms-logo span:nth-child(4) { background: #FFB900; }

  .hero { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
  .hero h1 { font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.15; }
  .hero p { font-size: 14px; color: var(--text-dim); margin-top: 8px; }
  .hero .updated { font-size: 12px; color: var(--text-faint); }

  .message {
    background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 12px;
    padding: 1.5rem; color: var(--text-dim); font-size: 13px;
  }
  .message code {
    font-family: ui-monospace, Menlo, monospace; background: var(--surface-2);
    border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--text);
  }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.25rem; }
  .kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-faint); }
  .kpi .v { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 500; margin-top: 4px; line-height: 1.1; }
  .kpi .v small { font-family: 'Manrope', sans-serif; font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .kpi .n { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 1rem 1.25rem; border-bottom: 1px solid var(--surface-2); }
  .panel-head h2 { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500; }
  .panel-head span { font-size: 12px; color: var(--text-faint); }
  .panel-body { padding: 1.1rem 1.25rem; }

  .progress-track { position: relative; height: 12px; background: var(--surface-2); border-radius: 999px; margin: 6px 0 8px; }
  .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--health); border-radius: 999px; min-width: 12px; }
  .progress-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { border: 1px solid var(--border); border-top: 4px solid var(--c); border-radius: 10px; padding: 10px; min-height: 96px; background: var(--surface); }
  .day.today { box-shadow: 0 0 0 2px var(--c); }
  .day .d { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-faint); }
  .day .w { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 500; color: var(--c); margin-top: 2px; }
  .day .s { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }

  .sessions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .sessions .panel { margin-bottom: 0; }
  .sessions .panel-head h2 { color: var(--c); }
  .note { font-size: 12px; color: var(--text-dim); padding: 0.75rem 1.25rem; border-top: 1px solid var(--surface-2); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 1.25rem; border-bottom: 1px solid var(--surface-2); font-size: 13px; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-faint); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.strong { font-weight: 600; }
  td.dim { color: var(--text-dim); font-size: 12px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .scroll { overflow-x: auto; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .two-col .panel { margin-bottom: 14px; }

  .meter { margin-bottom: 12px; }
  .meter:last-child { margin-bottom: 0; }
  .meter-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .meter-top b { color: var(--text); font-weight: 600; }
  .meter-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .meter-fill.protein { background: var(--health); }

  .rules { list-style: none; }
  .rules li { font-size: 13px; color: var(--text-dim); padding: 6px 0 6px 16px; position: relative; }
  .rules li::before { content: ''; position: absolute; left: 0; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--health); }

  .footer {
    margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; font-size: 12px; color: var(--text-faint);
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .sessions, .two-col { grid-template-columns: 1fr; }
    .week { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 520px) {
    .shell { padding: 1.5rem 1rem 3rem; }
    .week { grid-template-columns: repeat(2, 1fr); }
    .hero h1 { font-size: 28px; }
    th, td { padding: 8px 0.75rem; }
  }

  /* ---------- clickable day tiles ---------- */
  button.day { text-align: left; font: inherit; color: inherit; cursor: pointer; display: block; width: 100%; transition: transform 0.15s, box-shadow 0.15s; }
  button.day:hover { transform: translateY(-2px); }
  button.day:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  button.day.sel { box-shadow: 0 0 0 2px var(--c); }
  .day .d { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .day .d em { font-style: normal; font-size: 9px; letter-spacing: 1px; background: var(--c); color: #fff; padding: 1px 6px; border-radius: 999px; }
  .day .t { font-size: 11px; color: var(--text-faint); margin-top: 6px; }

  /* ---------- detail under a strip ---------- */
  .detail { margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--surface-2); }
  .detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }
  .detail-head h3 { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 500; color: var(--c); }
  .detail-head span { font-size: 12px; color: var(--text-dim); }
  .detail-note { margin-top: 1rem; font-size: 13px; color: var(--text-dim); background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
  .info { list-style: none; }
  .info li { font-size: 14px; color: var(--text-dim); padding: 6px 0 6px 18px; position: relative; }
  .info li::before { content: ''; position: absolute; left: 0; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

  /* ---------- exercise cards ---------- */
  .ex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .ex { border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; background: var(--bg); }
  .ex-top { display: flex; gap: 10px; align-items: flex-start; }
  .ex-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .ex-name { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500; line-height: 1.25; }
  .ex-next { font-size: 12px; color: var(--text-faint); }
  .fig-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; padding: 8px; }
  .fig { display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto; }
  .fig-bone { stroke: var(--text); stroke-width: 5.5; stroke-linecap: round; }
  .fig-head { fill: var(--text); }
  .fig-eq { stroke: var(--border-strong); stroke-width: 4; stroke-linecap: round; }
  .fig-plate { fill: var(--border-strong); }
  .fig-grip { stroke: var(--c); stroke-width: 6.5; stroke-linecap: round; }
  .fig-arrow { stroke: var(--c); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fig-label { font-family: 'Manrope', sans-serif; font-size: 10px; fill: var(--text-faint); text-anchor: middle; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; }
  .chip.wide { grid-column: span 2; }
  .chip b { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; }
  .chip span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); }
  .cues { list-style: none; }
  .cues li { font-size: 13px; color: var(--text-dim); padding: 3px 0 3px 16px; position: relative; }
  .cues li::before { content: ''; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  /* ---------- meals ---------- */
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 14px; }
  .meters .meter { margin-bottom: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .meal { border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; background: var(--bg); display: flex; flex-direction: column; }
  .meal-time { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-faint); }
  .meal-name { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500; line-height: 1.25; margin-bottom: 10px; }
  .meal-body { display: flex; gap: 12px; align-items: center; flex: 1; }
  .meal-pic { flex: none; width: 112px; }
  .meal-svg { display: block; width: 100%; height: auto; }
  .plate-rim { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
  .bowl-rim { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 5; }
  .wedge { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; }
  .vessel-line { fill: none; stroke: var(--border-strong); stroke-width: 3; stroke-linejoin: round; }
  .straw { stroke: var(--text-faint); stroke-width: 3; stroke-linecap: round; fill: none; }
  .meal-items { list-style: none; flex: 1; min-width: 0; }
  .meal-items li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 13px; }
  .meal-items li i { flex: none; width: 9px; height: 9px; border-radius: 3px; margin-top: 5px; }
  .meal-items b { font-weight: 600; display: block; line-height: 1.3; }
  .meal-items span { color: var(--text-dim); font-size: 12px; }
  .meal-foot { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); font-weight: 600; }

  @media (max-width: 900px) {
    .ex-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .meters { grid-template-columns: 1fr; gap: 12px; }
    .meal-grid { grid-template-columns: 1fr; }
    .meal-pic { width: 92px; }
  }
</style>
</head>
<body>

<div class="shell">

  <div class="topbar">
    <a href="../" class="brand-link">
      <div class="brand-mark">nemla</div>
      <div class="brand-tag">health</div>
    </a>
    <div id="user-chip" class="user-chip" hidden>
      <div id="user-avatar" class="user-avatar">N</div>
      <span id="user-email"></span>
      <button class="icon-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <section id="signin-view" hidden>
    <div class="signin-card">
      <div class="lock">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>
        </svg>
      </div>
      <h2 class="serif">Health</h2>
      <p>Training plan and meal plan. Sign in to load your tracker from OneDrive.</p>
      <button id="signin-btn" class="signin-btn" onclick="signIn()">
        <span class="ms-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        Sign in with Microsoft
      </button>
    </div>
  </section>

  <section id="dashboard-view" hidden>
    <div class="hero">
      <div>
        <h1 class="serif" id="hero-title">Health</h1>
        <p id="hero-sub">Loading your tracker.</p>
      </div>
      <div class="updated" id="hero-updated"></div>
    </div>

    <div id="message" class="message" hidden></div>
    <div id="content" hidden></div>
  </section>

  <div class="footer">
    <span>dash.nemla.com.au</span>
    <span id="status">Initialising</span>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONFIG  (shared across all dashboards)
   ============================================================ */
const AZURE_CLIENT_ID = 'f455b7f0-a8ad-4d17-8752-7a8b709607d1';
const AZURE_TENANT_ID = '91faaa92-6633-43b2-a302-8122e930e674';
const GRAPH_SCOPES    = ['Files.ReadWrite', 'Sites.ReadWrite.All', 'User.Read'];
/* Unlike the other dashboards, health data is personal and stays in the signed-in
   user's own OneDrive, not the shared SharePoint library. Nothing is stored in this
   page or in the repo; the file is read at runtime and never written back. */
const DATA_FILE = 'Nguyen/claude/Health/health.json';

const state = { msal: null, account: null, data: null, selTrain: null, selFood: null };
const $ = (q) => document.querySelector(q);

function setStatus(text) { $('#status').textContent = text; }
function toast(msg, ms = 2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================
   VIEW SWITCHING
   ============================================================ */
function showSignIn() {
  $('#signin-view').hidden = false;
  $('#dashboard-view').hidden = true;
  $('#user-chip').hidden = true;
  setStatus('Not signed in');
}
function showDashboard(account) {
  $('#signin-view').hidden = true;
  $('#dashboard-view').hidden = false;
  $('#user-chip').hidden = false;
  $('#user-email').textContent = account.username;
  $('#user-avatar').textContent = (account.name || account.username).charAt(0).toUpperCase();
  setStatus('Signed in');
}
function showMessage(html) {
  $('#message').innerHTML = html;
  $('#message').hidden = false;
  $('#content').hidden = true;
}

/* ============================================================
   MSAL
   ============================================================ */
/* Static Web Apps serves a folder with and without a trailing slash (and as
   .../index.html) all as 200, with no redirect, so window.location.pathname depends on
   how the page was reached. Entra matches redirect URIs exactly, so normalise every
   form to the one registered value. */
function appRedirectUri() {
  var path = window.location.pathname.replace(/index\.html$/i, '');
  if (path.charAt(path.length - 1) !== '/') path += '/';
  return window.location.origin + path;
}

async function initMsal() {
  try {
    state.msal = new msal.PublicClientApplication({
      auth: {
        clientId: AZURE_CLIENT_ID,
        authority: `https://login.microsoftonline.com/${AZURE_TENANT_ID}`,
        redirectUri: appRedirectUri()
      },
      cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
    });
    await state.msal.initialize();
    const resp = await state.msal.handleRedirectPromise();
    if (resp?.account) {
      state.msal.setActiveAccount(resp.account);
      state.account = resp.account;
    } else {
      const accounts = state.msal.getAllAccounts();
      if (accounts.length) {
        state.msal.setActiveAccount(accounts[0]);
        state.account = accounts[0];
      }
    }
    return true;
  } catch (e) {
    console.error('MSAL init failed', e);
    toast('Sign in service failed to load');
    return false;
  }
}

async function signIn() {
  if (!state.msal) return;
  const btn = $('#signin-btn');
  btn.disabled = true;
  try {
    const resp = await state.msal.loginPopup({ scopes: GRAPH_SCOPES, prompt: 'select_account' });
    state.msal.setActiveAccount(resp.account);
    state.account = resp.account;
    showDashboard(resp.account);
    await onSignedIn();
  } catch (e) {
    if (e.errorCode === 'popup_window_error') {
      state.msal.loginRedirect({ scopes: GRAPH_SCOPES });
      return;
    } else if (e.errorCode !== 'user_cancelled') {
      toast('Sign in failed: ' + (e.message || e.errorCode));
    }
    btn.disabled = false;
  }
}

async function signOut() {
  if (!state.msal || !state.account) return;
  await state.msal.logoutPopup({ account: state.account });
  state.account = null;
  location.reload();
}

window.signIn = signIn;
window.signOut = signOut;

/* ============================================================
   GRAPH API
   ============================================================ */
async function getToken() {
  const account = state.msal.getActiveAccount();
  if (!account) throw new Error('Not signed in');
  try {
    const r = await state.msal.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return r.accessToken;
  } catch (e) {
    const r = await state.msal.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    return r.accessToken;
  }
}

async function graphFetch(path, options = {}) {
  const token = await getToken();
  const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + token, ...(options.headers || {}) }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    const err = new Error('Graph ' + res.status + ': ' + text.slice(0, 200));
    err.status = res.status;
    throw err;
  }
  return res;
}

function encodePath(p) {
  return p.split('/').map(encodeURIComponent).join('/');
}

/* ============================================================
   DATA
   ============================================================ */
async function onSignedIn() {
  setStatus('Loading');
  try {
    const res = await graphFetch(`/me/drive/root:/${encodePath(DATA_FILE)}:/content`);
    const data = JSON.parse(await res.text());
    state.data = data;
    render(data);
    setStatus('Signed in');
  } catch (e) {
    console.error(e);
    if (e.status === 404) {
      showMessage('No tracker file found. It should be in your OneDrive at <code>' + esc(DATA_FILE) + '</code>.');
    } else {
      showMessage('Could not load the tracker. ' + esc(e.message || e));
    }
    $('#hero-sub').textContent = '';
    setStatus('Load failed');
  }
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY_NAMES = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };

function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function fmtDate(s, withYear) {
  const d = parseDate(s);
  if (!d) return String(s || '');
  return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (withYear ? ' ' + d.getFullYear() : '');
}
function num(n, dp) {
  return Number(n).toLocaleString('en-AU', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
}
function typeColor(t) {
  return ({ back: 'var(--back)', legs: 'var(--legs)', play: 'var(--play)', push: 'var(--push)', rest: 'var(--rest)' })[t] || 'var(--rest)';
}
function pct(a, b) {
  if (!b) return 0;
  return Math.max(0, Math.min(100, (a / b) * 100));
}

function line(a, b, cls) {
  return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" class="' + cls + '"/>';
}
function personSvg(p) {
  let s = '';
  (p.equip || []).forEach((e) => {
    s += e.length === 3
      ? '<circle cx="' + e[0] + '" cy="' + e[1] + '" r="' + e[2] + '" class="fig-plate"/>'
      : line([e[0], e[1]], [e[2], e[3]], 'fig-eq');
  });
  s += line(p.neck, p.hip, 'fig-bone');
  (p.legs || []).forEach((l) => { s += line(p.hip, l[0], 'fig-bone') + line(l[0], l[1], 'fig-bone'); });
  (p.arms || []).forEach((a) => { s += line(p.neck, a[0], 'fig-bone') + line(a[0], a[1], 'fig-bone'); });
  s += '<circle cx="' + p.head[0] + '" cy="' + p.head[1] + '" r="8.5" class="fig-head"/>';
  (p.grip || []).forEach((g) => { s += line([g[0], g[1]], [g[2], g[3]], 'fig-grip'); });
  return s;
}
function figureSvg(key, label) {
  const f = FIGURES[key];
  if (!f) return '';
  return '<svg class="fig" viewBox="0 0 280 160" role="img" aria-label="' + esc(label) + ', start and finish positions">'
    + '<g>' + personSvg(f.a) + '</g>'
    + '<path d="M128 72h22m-7-7 7 7-7 7" class="fig-arrow"/>'
    + '<g transform="translate(160 0)">' + personSvg(f.b) + '</g>'
    + '<text x="60" y="155" class="fig-label">' + esc(f.la) + '</text>'
    + '<text x="220" y="155" class="fig-label">' + esc(f.lb) + '</text>'
    + '</svg>';
}

/* ---------- meal visuals: plate, bowl or glass split by food group ---------- */
const GROUPS = {
  protein: { c: '#A8475F', l: 'Protein' },
  carb:    { c: '#C9A14A', l: 'Carbs' },
  veg:     { c: '#5B8C47', l: 'Vegetables' },
  fruit:   { c: '#B86842', l: 'Fruit' },
  fat:     { c: '#3E6A88', l: 'Healthy fat' }
};
function groupColor(g) { return (GROUPS[g] || { c: '#A9A292' }).c; }

function mealSvg(meal) {
  const items = (meal.items || []).filter((i) => Number(i.share) > 0);
  const total = items.reduce((s, i) => s + Number(i.share), 0) || 1;
  const label = esc(meal.name) + ', shown as a ' + esc(meal.vessel || 'plate');
  if (meal.vessel === 'glass') {
    const top = 22, bottom = 124, h = bottom - top;
    let y = bottom, s = '';
    items.forEach((i) => {
      const hh = h * Number(i.share) / total;
      y -= hh;
      s += '<rect x="38" y="' + y.toFixed(1) + '" width="44" height="' + (hh + 0.5).toFixed(1) + '" fill="' + groupColor(i.group) + '"/>';
    });
    return '<svg class="meal-svg" viewBox="0 0 120 136" role="img" aria-label="' + label + '">'
      + '<defs><clipPath id="glass-clip"><path d="M36 20h48l-5 100a6 6 0 0 1-6 6H47a6 6 0 0 1-6-6z"/></clipPath></defs>'
      + '<g clip-path="url(#glass-clip)">' + s + '</g>'
      + '<path d="M36 20h48l-5 100a6 6 0 0 1-6 6H47a6 6 0 0 1-6-6z" class="vessel-line"/>'
      + '<path d="M70 6 62 60" class="straw"/></svg>';
  }
  const cx = 60, cy = 68, r = meal.vessel === 'bowl' ? 40 : 44;
  let ang = -Math.PI / 2, s = '';
  if (items.length === 1) {
    s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + groupColor(items[0].group) + '"/>';
  } else {
    items.forEach((i) => {
      const a2 = ang + 2 * Math.PI * Number(i.share) / total;
      const x1 = cx + r * Math.cos(ang), y1 = cy + r * Math.sin(ang);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const large = (a2 - ang) > Math.PI ? 1 : 0;
      s += '<path d="M' + cx + ' ' + cy + 'L' + x1.toFixed(2) + ' ' + y1.toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 '
        + x2.toFixed(2) + ' ' + y2.toFixed(2) + 'Z" fill="' + groupColor(i.group) + '" class="wedge"/>';
      ang = a2;
    });
  }
  const rim = meal.vessel === 'bowl'
    ? '<circle cx="' + cx + '" cy="' + cy + '" r="54" class="bowl-rim"/>'
    : '<circle cx="' + cx + '" cy="' + cy + '" r="56" class="plate-rim"/>';
  return '<svg class="meal-svg" viewBox="0 0 120 136" role="img" aria-label="' + label + '">' + rim + s + '</svg>';
}

/* ---------- detail panels ---------- */
function workoutHtml(d) {
  const c = typeColor(d.type);
  let h = '<div class="detail" style="--c:' + c + '"><div class="detail-head"><h3>' + esc(DAY_NAMES[d.day] || d.day) + ' · ' + esc(d.label) + '</h3>';
  if (d.workout) h += '<span>' + esc(d.workout.duration) + '</span>';
  h += '</div>';
  if (!d.workout) {
    h += '<ul class="info">';
    (d.info || [d.note]).forEach((x) => { if (x) h += '<li>' + esc(x) + '</li>'; });
    return h + '</ul></div>';
  }
  h += '<div class="ex-grid">';
  d.workout.exercises.forEach((x, i) => {
    h += '<div class="ex"><div class="ex-top"><span class="ex-n">' + (i + 1) + '</span><div><div class="ex-name">' + esc(x.name)
      + '</div><div class="ex-next">' + esc(x.next) + '</div></div></div>';
    const fig = figureSvg(x.figure, x.name);
    if (fig) h += '<div class="fig-wrap">' + fig + '</div>';
    h += '<div class="chips">';
    if (x.sets) h += '<div class="chip"><b>' + esc(x.sets) + '</b><span>sets</span></div>';
    if (x.reps) h += '<div class="chip"><b>' + esc(x.reps) + '</b><span>' + (/s$/.test(String(x.reps)) ? 'hold' : 'reps') + '</span></div>';
    if (x.weight) h += '<div class="chip wide"><b>' + esc(x.weight) + '</b><span>weight</span></div>';
    if (x.rest) h += '<div class="chip wide"><b>' + esc(x.rest) + '</b><span>rest between sets</span></div>';
    h += '</div><ul class="cues">';
    (x.cues || []).forEach((q) => { h += '<li>' + esc(q) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div>';
  if (d.workout.note) h += '<div class="detail-note">' + esc(d.workout.note) + '</div>';
  return h + '</div>';
}

function dayTotals(fd) {
  return (fd.meals || []).reduce((t, m) => ({ kcal: t.kcal + (Number(m.kcal) || 0), protein: t.protein + (Number(m.protein) || 0) }), { kcal: 0, protein: 0 });
}

function foodHtml(fd, targets) {
  const tot = dayTotals(fd);
  let h = '<div class="detail" style="--c:var(--accent)"><div class="detail-head"><h3>' + esc(DAY_NAMES[fd.day] || fd.day) + ' · ' + esc(fd.title)
    + '</h3><span>about ' + num(tot.kcal) + ' kcal, ' + num(tot.protein) + ' g protein</span></div>';
  h += '<div class="meters">'
    + '<div class="meter"><div class="meter-top"><span>Calories</span><span><b>' + num(tot.kcal) + '</b> of ' + num(targets.kcal) + '</span></div>'
    + '<div class="meter-track"><div class="meter-fill" style="width:' + pct(tot.kcal, targets.kcal).toFixed(1) + '%"></div></div></div>'
    + '<div class="meter"><div class="meter-top"><span>Protein</span><span><b>' + num(tot.protein) + ' g</b> of ' + num(targets.proteinG) + ' g</span></div>'
    + '<div class="meter-track"><div class="meter-fill protein" style="width:' + pct(tot.protein, targets.proteinG).toFixed(1) + '%"></div></div></div>'
    + '</div>';
  h += '<div class="legend">';
  Object.keys(GROUPS).forEach((k) => { h += '<span><i style="background:' + GROUPS[k].c + '"></i>' + GROUPS[k].l + '</span>'; });
  h += '</div><div class="meal-grid">';
  (fd.meals || []).forEach((m) => {
    h += '<div class="meal"><div class="meal-time">' + esc(m.time) + '</div><div class="meal-name">' + esc(m.name) + '</div>'
      + '<div class="meal-body"><div class="meal-pic">' + mealSvg(m) + '</div><ul class="meal-items">';
    (m.items || []).forEach((i) => {
      h += '<li><i style="background:' + groupColor(i.group) + '"></i><div><b>' + esc(i.name) + '</b><span>' + esc(i.amount) + '</span></div></li>';
    });
    h += '</ul></div><div class="meal-foot"><span>' + num(m.kcal) + ' kcal</span><span>' + num(m.protein) + ' g protein</span></div></div>';
  });
  h += '</div>';
  if (fd.note) h += '<div class="detail-note">' + esc(fd.note) + '</div>';
  return h + '</div>';
}

/* ---------- page ---------- */
function render(data) {
  const p = data.profile || {};
  const t = data.targets || {};
  const weighIns = (data.weighIns || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const latest = weighIns.length ? weighIns[weighIns.length - 1] : null;
  const current = latest ? Number(latest.kg) : Number(p.startKg);
  const gained = current - Number(p.startKg);
  const span = Number(p.goalKg) - Number(p.startKg);
  const today = DAYS[new Date().getDay()];
  const week = data.week || [];
  const foodWeek = data.foodWeek || [];

  if (!state.selTrain || !week.some((d) => d.day === state.selTrain)) state.selTrain = week.some((d) => d.day === today) ? today : (week[0] || {}).day;
  if (!state.selFood || !foodWeek.some((d) => d.day === state.selFood)) state.selFood = foodWeek.some((d) => d.day === today) ? today : (foodWeek[0] || {}).day;

  $('#hero-title').textContent = num(p.startKg, 0) + ' kg to ' + num(p.goalKg, 0) + ' kg';
  $('#hero-sub').textContent = 'Lean gain plan, started ' + fmtDate(p.startDate, true) + '.';
  $('#hero-updated').textContent = data.updated ? 'Updated ' + fmtDate(data.updated, true) : '';

  let html = '';

  html += '<div class="kpis">'
    + '<div class="kpi"><div class="k">Current</div><div class="v">' + num(current, 1) + ' <small>kg</small></div><div class="n">'
    + (latest ? esc(fmtDate(latest.date)) : 'no weigh-in yet') + '</div></div>'
    + '<div class="kpi"><div class="k">Gained</div><div class="v">' + (gained >= 0 ? '+' : '') + num(gained, 1) + ' <small>kg</small></div><div class="n">'
    + num(Math.max(0, Number(p.goalKg) - current), 1) + ' kg to go</div></div>'
    + '<div class="kpi"><div class="k">Calories</div><div class="v">' + num(t.kcal) + '</div><div class="n">per day</div></div>'
    + '<div class="kpi"><div class="k">Protein</div><div class="v">' + num(t.proteinG) + ' <small>g</small></div><div class="n">per day</div></div>'
    + '</div>';

  html += '<div class="panel"><div class="panel-head"><h2>Progress</h2><span>target '
    + esc(t.rateLow) + ' to ' + esc(t.rateHigh) + ' kg per week</span></div><div class="panel-body">'
    + '<div class="progress-track"><div class="progress-fill" style="width:' + pct(gained, span).toFixed(1) + '%"></div></div>'
    + '<div class="progress-ends"><span>' + num(p.startKg, 1) + ' kg start</span><span>' + num(p.goalKg, 1) + ' kg goal</span></div>'
    + '</div></div>';

  /* Training week */
  html += '<div class="panel"><div class="panel-head"><h2>Training this week</h2><span>tap a day to open it</span></div><div class="panel-body"><div class="week">';
  week.forEach((d) => {
    html += '<button type="button" class="day' + (d.day === state.selTrain ? ' sel' : '') + '" data-train="' + esc(d.day) + '" aria-pressed="'
      + (d.day === state.selTrain) + '" style="--c:' + typeColor(d.type) + '">'
      + '<div class="d">' + esc(d.day) + (d.day === today ? '<em>today</em>' : '') + '</div><div class="w">' + esc(d.label)
      + '</div><div class="s">' + esc(d.note) + '</div></button>';
  });
  html += '</div>';
  const selT = week.find((d) => d.day === state.selTrain);
  if (selT) html += workoutHtml(selT);
  html += '</div></div>';

  /* Food week */
  if (foodWeek.length) {
    html += '<div class="panel"><div class="panel-head"><h2>Food this week</h2><span>tap a day to see the meals</span></div><div class="panel-body"><div class="week">';
    foodWeek.forEach((fd) => {
      const tot = dayTotals(fd);
      const names = (fd.meals || []).map((m) => m.name.split(/,| and | with /)[0]).slice(0, 4).join(', ');
      html += '<button type="button" class="day' + (fd.day === state.selFood ? ' sel' : '') + '" data-food="' + esc(fd.day) + '" aria-pressed="'
        + (fd.day === state.selFood) + '" style="--c:var(--accent)">'
        + '<div class="d">' + esc(fd.day) + (fd.day === today ? '<em>today</em>' : '') + '</div><div class="w">' + esc(fd.title)
        + '</div><div class="s">' + esc(names) + '</div><div class="t">' + num(tot.kcal) + ' kcal · ' + num(tot.protein) + ' g</div></button>';
    });
    html += '</div>';
    const selF = foodWeek.find((d) => d.day === state.selFood);
    if (selF) html += foodHtml(selF, t);
    html += '</div></div>';
  }

  $('#content').innerHTML = html;
  $('#message').hidden = true;
  $('#content').hidden = false;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest ? e.target.closest('button.day') : null;
  if (!b || !state.data) return;
  const y = window.scrollY;
  if (b.dataset.train) state.selTrain = b.dataset.train;
  if (b.dataset.food) state.selFood = b.dataset.food;
  render(state.data);
  window.scrollTo(0, y);
});

/* ============================================================
   BOOT
   ============================================================ */
async function start() {
  const ok = await initMsal();
  if (!ok) {
    showSignIn();
    return;
  }
  if (state.account) {
    showDashboard(state.account);
    await onSignedIn();
  } else {
    showSignIn();
  }
}
start();
</script>
